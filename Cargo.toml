[package]
name = "codex-status-blink"
version = "0.1.0"
edition = "2024"
description = "Show Codex usage remaining on a blink(1) LED"
license = "BSD-3-Clause"

[dependencies]
blink1rs = { version = "0.2", default-features = false }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
